name: Live

# Smoke test against a real Codex CLI and the live OpenAI service. Manual
# only: it costs tokens and needs the CODEX_API_KEY repository secret.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
    steps:
      - name: Check secret
        run: |
          if [ -z "$CODEX_API_KEY" ]; then
            echo "::error::Repository secret CODEX_API_KEY is not set"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Codex CLI
        run: npm install -g @openai/codex && codex --version
      - name: Live tests
        run: make test-live
